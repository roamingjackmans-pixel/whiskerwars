# Whisker Wars is no longer on the site: josephjackman.com shows Alt Whisker Wars instead.
# On every push to main this publishes only retired/, a page that sends anyone who opens
# /whiskerwars/ (old links, installed apps) to /altwhiskerwars/.
# To put the game back, restore the previous version of this file (git log -- .github/workflows/pages.yml),
# which published public/ with the peer-to-peer and version-stamp steps.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: retired
      - id: deployment
        uses: actions/deploy-pages@v4
